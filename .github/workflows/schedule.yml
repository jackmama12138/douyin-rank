name: Schedule

on:
  repository_dispatch:
    types:
      - webhook
  workflow_dispatch:
  schedule:
    - cron: "50 * * * *" # 每小时50分触发

jobs:
  Release:
    runs-on: ubuntu-latest  # Linux runner 文件系统快

    steps:
      # 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Checkout 仓库 (只拉必要目录)
      - name: Checkout code (sparse)
        uses: actions/checkout@v3
        with:
          ref: master
          fetch-depth: 1   # 只拉最新提交
          sparse-checkout: |
            src/index.js
            package.json
            package-lock.json

      # 配置 Git 用户
      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github"

      # 缓存 Node.js 依赖
      - name: Cache Node.js modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 安装依赖
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      # 构建数据（JSON 输出到临时目录，不提交 Git）
      - name: Build Data
        env:
          ANCHOR_ID: ${{ secrets.ANCHOR_ID }}
          ROOM_ID: ${{ secrets.ROOM_ID }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          A_BOGUS: ${{ secrets.A_BOGUS }}
        run: |
          mkdir -p /tmp/data
          node src/index.js /tmp/data
          # 可选：上传 /tmp/data 到云端，如果需要保留历史

      # Git 只提交源码更新，不提交 JSON
      - name: Commit & Push code
        run: |
          git add src/index.js
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update code"
            git push origin master
          else
            echo "No changes to commit"
